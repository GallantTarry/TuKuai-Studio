<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b8d7e2" />
  <title>别来无恙</title>
  <link rel="icon" href="imgs/TuKuaiStudio.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="imgs/TuKuaiStudio.ico" type="image/x-icon" />
  <style>
    /* 全局重置 */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", STSong, SimSun, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 视频背景全屏层 */
    #video-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }

    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: filter 1.6s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: filter, transform;
    }

    /* 视频播放完毕后：背景转化为清爽毛玻璃雾化状态 */
    body.frosted-active #bg-video {
      filter: blur(28px) brightness(0.96) saturate(125%);
      transform: scale(1.08); /* 放大8%消除窗口边缘模糊露出的黑边 */
    }

    /* 雾化毛玻璃层 (Frosted Mist Glass Layer) */
    #frost-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(32px) saturate(140%) brightness(1.02);
      -webkit-backdrop-filter: blur(32px) saturate(140%) brightness(1.02);
      background: radial-gradient(
        ellipse at 50% 40%,
        rgba(255, 255, 255, 0.38) 0%,
        rgba(238, 246, 255, 0.48) 50%,
        rgba(215, 235, 250, 0.65) 100%
      );
      box-shadow: inset 0 0 140px rgba(255, 255, 255, 0.45);
      transition: opacity 1.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }

    /* 磨砂微粒质感 */
    .frost-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.045;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    body.frosted-active #frost-overlay {
      opacity: 1;
    }

    /* 纯净UI高光容器 (层级位于毛玻璃之上，保持绝对锐利) */
    #ui-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.25s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    body.frosted-active #ui-container {
      opacity: 1;
      pointer-events: auto;
    }

    /* Logo 视觉包装盒：精准对齐视频尾帧几何中心 (Y: 41.7%) */
    .ui-content {
      position: absolute;
      top: 41.7%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 柔透微光晕 */
    .logo-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(360px, 60vh, 520px);
      height: clamp(360px, 60vh, 520px);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.95) 0%,
        rgba(255, 255, 255, 0.55) 30%,
        rgba(210, 240, 255, 0.28) 55%,
        rgba(255, 255, 255, 0) 72%
      );
      filter: blur(36px);
      pointer-events: none;
      animation: breatheHalo 4.5s ease-in-out infinite;
    }

    @keyframes breatheHalo {
      0%, 100% {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(0.96);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.06);
      }
    }

    /* 纯净 Logo 特效包装 */
    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      animation: floatLogo 5s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    /* 高清 Logo 图像：多重清澈投影 */
    .ui-logo {
      display: block;
      width: clamp(340px, 78vh, 580px);
      height: clamp(340px, 78vh, 580px);
      object-fit: contain;
      filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.98))
              drop-shadow(0 0 65px rgba(130, 210, 255, 0.7))
              drop-shadow(0 16px 36px rgba(15, 35, 60, 0.18));
      transition: filter 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .ui-logo:hover {
      transform: scale(1.03);
      filter: drop-shadow(0 0 38px rgba(255, 255, 255, 1))
              drop-shadow(0 0 85px rgba(145, 225, 255, 0.9))
              drop-shadow(0 20px 45px rgba(15, 35, 60, 0.22));
    }

    /* 下方跳转按钮区 (居中沉底，平滑上浮) */
    .btn-container {
      position: fixed;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%) translateY(24px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s,
                  transform 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s;
    }

    body.frosted-active .btn-container {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* 磨砂质感极简胶囊按钮 (Glassmorphism Pill Button) */
    .glass-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 13px 44px 13px 48px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 32px rgba(18, 45, 65, 0.14),
                  inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95),
                  0 0 24px rgba(255, 255, 255, 0.5);
      color: #1b2e3e;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.38em;
      white-space: nowrap;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-tap-highlight-color: transparent;
    }

    /* 按钮内部扫光高光动效 */
    .glass-btn::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.65) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      transition: left 0.75s ease;
      pointer-events: none;
    }

    .glass-btn:hover::after {
      left: 120%;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.75);
      border-color: #ffffff;
      color: #0b1c2b;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 42px rgba(45, 120, 180, 0.25),
                  inset 0 1.5px 1.5px #ffffff,
                  0 0 35px rgba(255, 255, 255, 0.85);
    }

    .glass-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 6px 20px rgba(18, 45, 65, 0.15);
    }

    .glass-btn .btn-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s ease;
    }

    .glass-btn:hover .btn-arrow {
      transform: translateX(4px);
    }

    /* 左上角潮汐海鸥环境音控制胶囊 (Ambient Sound Pill) */
    .ambient-pill {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.26);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 8px 24px rgba(0, 20, 40, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.8);
      color: #1a2e3b;
      font-size: 0.86rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      opacity: 0.9;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .ambient-pill:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.45);
      border-color: rgba(255, 255, 255, 0.9);
      transform: scale(1.03);
      box-shadow: 0 10px 28px rgba(0, 20, 40, 0.18), inset 0 1px 1px #ffffff;
    }

    .ambient-pill .wave-symbol {
      font-size: 1.05rem;
      line-height: 1;
      filter: drop-shadow(0 0 6px rgba(100, 180, 255, 0.6));
      animation: waveFloat 3s ease-in-out infinite;
    }

    @keyframes waveFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    .ambient-pill svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: currentColor;
    }

    /* 引导页毛玻璃状态下微调胶囊样式，与纯白透亮视觉融合 */
    body.frosted-active .ambient-pill {
      background: rgba(255, 255, 255, 0.42);
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px rgba(15, 35, 60, 0.08), inset 0 1px 1.5px #ffffff;
    }

    /* 右上角跳过按钮 */
    .skip-btn {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      opacity: 0.85;
      transition: all 0.3s ease;
    }

    .skip-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.32);
      border-color: rgba(255, 255, 255, 0.8);
      color: #ffffff;
      transform: scale(1.04);
    }

    body.frosted-active .skip-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
    }

    /* 移动端视口适配 */
    @media (max-width: 640px) {
      .ui-logo {
        width: clamp(260px, 70vw, 360px);
        height: clamp(260px, 70vw, 360px);
      }
      .logo-halo {
        width: clamp(280px, 75vw, 380px);
        height: clamp(280px, 75vw, 380px);
      }
      .glass-btn {
        padding: 12px 34px 12px 38px;
        font-size: 0.95rem;
        letter-spacing: 0.3em;
      }
      .btn-container {
        bottom: 8vh;
      }
      .skip-btn {
        top: 18px;
        right: 18px;
        padding: 5px 14px;
        font-size: 0.8rem;
      }
      .ambient-pill {
        top: 18px;
        left: 18px;
        padding: 5px 13px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>

  <!-- 视频背景 (静音以保证全终端100%无阻碍自动起播) -->
  <div id="video-wrapper">
    <video
      id="bg-video"
      playsinline
      muted
      autoplay
      preload="auto"
      disablePictureInPicture
    >
      <source src="video/intro.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- 独立背景音频播放器：即使视频播放完毕，《言叶之庭》钢琴曲依然在网页中持续轻柔循环 -->
  <audio id="ambient-audio" loop preload="auto">
    <source src="audio/言叶之庭.acc" type="audio/aac" />
  </audio>

  <!-- 雾化毛玻璃层 -->
  <div id="frost-overlay">
    <div class="frost-noise"></div>
  </div>

  <!-- 左上角：背景音乐控制胶囊 -->
  <div id="ambient-toggle" class="ambient-pill">
    
    <span id="ambient-text">Hello</span>
    <!-- 扬声器开启图标 -->
    <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
    <!-- 扬声器静音图标 -->
    <svg id="icon-sound-off" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </div>

  <!-- 右上角跳过按钮 -->
  <button id="skip-btn" class="skip-btn" type="button" aria-label="跳过视频">
    <span>跳过</span>
    <span style="font-size: 1.1em; line-height: 1;">&rsaquo;</span>
  </button>

  <!-- 纯净毛玻璃UI层：保持锐利高光 -->
  <main id="ui-container" aria-hidden="true">
    <div class="ui-content">
      <div class="logo-halo"></div>
      <div class="logo-wrapper">
        <img
          id="ui-logo"
          class="ui-logo"
          src="imgs/TuKuaiStudio.png"
          alt="图快工坊 TuKuai Studio"
          draggable="false"
        />
      </div>
    </div>

    <!-- 极简毛玻璃胶囊进入按钮 -->
    <div class="btn-container">
      <a href="index.html" class="glass-btn" id="enter-btn">
        <span>进入工坊</span>
        <span class="btn-arrow">&rarr;</span>
      </a>
    </div>
  </main>

  <script>
  (function () {
    const video = document.getElementById('bg-video');
    const ambientAudio = document.getElementById('ambient-audio');
    const skipBtn = document.getElementById('skip-btn');
    const logoImg = document.getElementById('ui-logo');
    const ambientToggle = document.getElementById('ambient-toggle');
    const ambientText = document.getElementById('ambient-text');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    
    let isRevealed = false;
    let isAudioPlaying = false;
    const TARGET_AMBIENT_VOL = 0.28; // 声音小点，轻柔舒适适耳音量

    // 平滑音量渐变调节
    function rampVolume(audioEl, targetVol, durationMs, onComplete) {
      const startVol = audioEl.volume;
      const startTime = performance.now();
      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / durationMs, 1);
        audioEl.volume = startVol + (targetVol - startVol) * progress;
        if (progress < 1) {
          requestAnimationFrame(step);
        } else if (onComplete) {
          onComplete();
        }
      }
      requestAnimationFrame(step);
    }

    // 更新环境音胶囊 UI
    function updateAudioUI(playing, label) {
      isAudioPlaying = playing;
      if (ambientText) {
        ambientText.textContent = label || (playing ? 'Hello' : 'World');
      }
      if (iconSoundOn && iconSoundOff) {
        iconSoundOn.style.display = playing ? 'inline-block' : 'none';
        iconSoundOff.style.display = playing ? 'none' : 'inline-block';
      }
      if (ambientToggle) {
        ambientToggle.style.opacity = playing ? '0.92' : '0.65';
      }
    }

    // 播放背景音乐
    function playAmbientAudio() {
      ambientAudio.volume = 0;
      ambientAudio.loop = true;
      const promise = ambientAudio.play();
      if (promise !== undefined) {
        promise.then(() => {
          rampVolume(ambientAudio, TARGET_AMBIENT_VOL, 600);
          updateAudioUI(true, 'Hello');
          detachGestures();
        }).catch(() => {
          // 浏览器强安全策略拦截起播，展示交互轻触提示
          updateAudioUI(false, 'World');
        });
      }
    }

    // 切换环境音开关
    function toggleAmbientAudio() {
      if (ambientAudio.paused || !isAudioPlaying) {
        ambientAudio.play().then(() => {
          rampVolume(ambientAudio, TARGET_AMBIENT_VOL, 300);
          updateAudioUI(true, 'Hello');
        }).catch(() => {});
      } else {
        rampVolume(ambientAudio, 0, 250, () => {
          ambientAudio.pause();
          updateAudioUI(false, 'World');
        });
      }
      detachGestures();
    }

    // 首次交互被动触发
    function onFirstGesture() {
      if (ambientAudio.paused || !isAudioPlaying) {
        playAmbientAudio();
      }
      detachGestures();
    }

    function detachGestures() {
      window.removeEventListener('pointerdown', onFirstGesture);
      window.removeEventListener('touchstart', onFirstGesture);
      window.removeEventListener('keydown', onFirstGesture);
      window.removeEventListener('wheel', onFirstGesture);
      window.removeEventListener('mousemove', onFirstGesture);
    }

    // 尝试直接静音起播环境音（若允许无阻碍自动播放）
    playAmbientAudio();

    // 监听任意用户微弱交互以确保100%能够开启声音
    window.addEventListener('pointerdown', onFirstGesture, { once: true, passive: true });
    window.addEventListener('touchstart', onFirstGesture, { once: true, passive: true });
    window.addEventListener('keydown', onFirstGesture, { once: true, passive: true });
    window.addEventListener('wheel', onFirstGesture, { once: true, passive: true });
    window.addEventListener('mousemove', onFirstGesture, { once: true, passive: true });

    if (ambientToggle) {
      ambientToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleAmbientAudio();
      });
    }

    // 视频结束并转化为毛玻璃雾化UI
    function revealFrostedUI() {
      if (isRevealed) return;
      isRevealed = true;

      // 视频暂停在最终精美尾帧
      try {
        video.pause();
      } catch (err) {}

      // 注意：此处 ambientAudio 绝不暂停！持续循环播放背景音乐
      if (ambientAudio.paused) {
        ambientAudio.play().catch(() => {});
      }

      // 激活毛玻璃全屏雾化与高光UI
      document.body.classList.add('frosted-active');
      const uiContainer = document.getElementById('ui-container');
      if (uiContainer) {
        uiContainer.removeAttribute('aria-hidden');
      }
    }

    // 1. 视频自然播放到结尾转场
    video.addEventListener('ended', revealFrostedUI, { once: true });

    // 2. 紧贴视频尾帧 (剩余 0.15 秒) 提前平滑转场，避免黑屏
    video.addEventListener('timeupdate', function () {
      if (video.duration && video.currentTime >= video.duration - 0.15) {
        revealFrostedUI();
      }
    });

    // 3. 点击跳过按钮转场
    skipBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (video.duration) {
        try {
          video.currentTime = Math.max(0, video.duration - 0.05);
        } catch (err) {}
      }
      revealFrostedUI();
    });

    // 4. 容错兜底：若视频异常无法加载，直接展示毛玻璃UI
    video.addEventListener('error', function () {
      console.warn('视频未响应，直接展示毛玻璃工坊引导界面。');
      revealFrostedUI();
    });

    // 5. 键盘空格/回车键快速跳过视频
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') {
        if (!isRevealed) {
          revealFrostedUI();
        }
      }
    });

    // 6. 页面可见性管理：切后台时暂停，切回时恢复
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (!isRevealed && !video.paused) {
          video.pause();
        }
        if (!ambientAudio.paused) {
          ambientAudio.pause();
        }
      } else {
        if (!isRevealed && video.paused) {
          video.play().catch(function () {});
        }
        if (isAudioPlaying && ambientAudio.paused) {
          ambientAudio.play().catch(function () {});
        }
      }
    });
  
    // 彻底隐藏全站所有原生悬停提示 (Tooltips)
    document.addEventListener('mouseover', e => {
      let el = e.target;
      while (el && el !== document) {
        if (el.hasAttribute && el.hasAttribute('title')) {
          el.removeAttribute('title');
        }
        el = el.parentElement;
      }
    }, { capture: true, passive: true });
  })();
  </script>
</body>
</html>
