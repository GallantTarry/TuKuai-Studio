<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b8d7e2" />
  <title>别来无恙</title>
  <link rel="icon" href="imgs/TuKuaiStudio.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="imgs/TuKuaiStudio.ico" type="image/x-icon" />
  <!-- 预加载首帧海报、预渲染毛玻璃尾帧与高清 Logo，0 毫秒立现且零 GPU 卡顿 -->
  <link rel="preload" as="image" href="imgs/intro_poster.jpg" fetchpriority="high" />
  <link rel="preload" as="image" href="imgs/intro_frosted.jpg" />
  <link rel="preload" as="image" href="imgs/TuKuaiStudio.png" />
  <style>
    /* 全局重置 */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #b8d7e2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", STSong, SimSun, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }

    /* 视频背景全屏层：使用静态首帧图兜底，不对 <video> 施加任何实时滤镜以彻底杜绝手机端 GPU 卡死 */
    #video-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 1;
      overflow: hidden;
      background: #b8d7e2 url("imgs/intro_poster.jpg") center center / cover no-repeat;
    }

    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: transparent;
      transform: translateZ(0);
    }

    /* 雾化毛玻璃层：采用预渲染高清高斯雾化图，仅做纯硬件加速 opacity 过渡，手机端满帧零开销 */
    #frost-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      background: #d8eaf6 url("imgs/intro_frosted.jpg") center center / cover no-repeat;
      box-shadow: inset 0 0 120px rgba(255, 255, 255, 0.45);
      transition: opacity 1.15s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }

    body.frosted-active #frost-overlay {
      opacity: 1;
    }

    /* 移动端/受限环境下的诗意轻触唤醒层（全屏任意处轻触即刻同步起播） */
    #touch-veil {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 11vh;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      background: radial-gradient(
        circle at 50% 82%,
        rgba(12, 32, 52, 0.18) 0%,
        rgba(12, 32, 52, 0) 60%
      );
      transition: opacity 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }

    body.awaiting-gesture #touch-veil {
      opacity: 1;
      pointer-events: auto;
    }

    .touch-cue {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* 呼吸水波光环 */
    .touch-ripple-ring {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 24px rgba(15, 40, 68, 0.16),
                  inset 0 1px 1.5px rgba(255, 255, 255, 0.92);
    }

    .touch-ripple-ring::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.65);
      animation: ripplePulse 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      pointer-events: none;
    }

    .touch-core-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
    }

    @keyframes ripplePulse {
      0% {
        transform: scale(1);
        opacity: 0.78;
      }
      100% {
        transform: scale(2.05);
        opacity: 0;
      }
    }

    .touch-caption {
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 2px 10px rgba(10, 30, 52, 0.45);
    }

    /* 纯净UI高光容器 (与第二声钢琴和弦同步浮现) */
    #ui-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }

    body.frosted-active #ui-container {
      opacity: 1;
      pointer-events: auto;
    }

    /* Logo 视觉包装盒：精准对齐视频尾帧几何中心 (Y: 41.7%) */
    .ui-content {
      position: absolute;
      top: 41.7%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0) scale(0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 1.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.frosted-active .ui-content {
      transform: translate3d(-50%, -50%, 0) scale(1);
    }

    /* 柔透微光晕：纯径向渐变实现柔和光晕，避免动态 blur 滤镜消耗手机显存 */
    .logo-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: clamp(380px, 68vh, 580px);
      height: clamp(380px, 68vh, 580px);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.96) 0%,
        rgba(255, 255, 255, 0.68) 26%,
        rgba(165, 225, 255, 0.38) 48%,
        rgba(210, 240, 255, 0.12) 64%,
        rgba(255, 255, 255, 0) 76%
      );
      pointer-events: none;
      animation: breatheHalo 4.5s ease-in-out infinite;
    }

    @keyframes breatheHalo {
      0%, 100% {
        opacity: 0.86;
        transform: translate3d(-50%, -50%, 0) scale(0.96);
      }
      50% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) scale(1.05);
      }
    }

    /* 纯净 Logo 特效包装 */
    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatLogo 5s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translate3d(0, 0, 0);
      }
      50% {
        transform: translate3d(0, -7px, 0);
      }
    }

    /* 高清 Logo 图像：轻量硬件合成，杜绝多重高半径 drop-shadow 导致移动端掉帧 */
    .ui-logo {
      display: block;
      width: clamp(340px, 78vh, 560px);
      height: clamp(340px, 78vh, 560px);
      object-fit: contain;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transform: translate3d(0, 0, 0);
      filter: drop-shadow(0 12px 26px rgba(15, 38, 65, 0.16));
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .ui-logo:hover {
      transform: scale(1.03) translate3d(0, 0, 0);
    }

    /* ==========================================================
       全新极简高定「流光晶透羽化入口」设计 (Portal Entry)
       ========================================================== */
    .portal-container {
      position: fixed;
      bottom: 9.2vh;
      left: 50%;
      transform: translate3d(-50%, 18px, 0);
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                  transform 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }

    body.frosted-active .portal-container {
      opacity: 1;
      transform: translate3d(-50%, 0, 0);
      pointer-events: auto;
    }

    .portal-entry {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 12px 36px 12px 42px;
      border-radius: 9999px;
      text-decoration: none;
      color: #16293a;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.76) 0%,
        rgba(244, 250, 255, 0.56) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 32px rgba(16, 42, 68, 0.10),
                  inset 0 1px 1.5px rgba(255, 255, 255, 0.98),
                  0 0 24px rgba(255, 255, 255, 0.45);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.4s ease,
                  box-shadow 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* 五色微光极光底衬（呼应图快五瓣色彩） */
    .portal-entry::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        rgba(250, 124, 133, 0.12),
        rgba(104, 189, 245, 0.14),
        rgba(72, 203, 161, 0.12),
        rgba(245, 202, 85, 0.12),
        rgba(174, 125, 232, 0.12)
      );
      opacity: 0.6;
      pointer-events: none;
    }

    .portal-entry:hover {
      transform: translate3d(0, -2px, 0) scale(1.025);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.72) 100%
      );
      border-color: #ffffff;
      color: #0c1d2c;
      box-shadow: 0 16px 40px rgba(32, 95, 150, 0.16),
                  inset 0 1.5px 2px #ffffff,
                  0 0 32px rgba(255, 255, 255, 0.8);
    }

    .portal-entry:active {
      transform: translate3d(0, 0.5px, 0) scale(0.98);
    }

    /* 左侧呼吸星芒微点 */
    .portal-spark {
      position: relative;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3989ec, #27ad80);
      box-shadow: 0 0 8px rgba(57, 137, 236, 0.6);
      flex-shrink: 0;
    }

    .portal-label {
      position: relative;
      z-index: 1;
      font-size: 0.96rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      white-space: nowrap;
    }

    .portal-icon {
      position: relative;
      z-index: 1;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #243b4f;
      opacity: 0.82;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }

    .portal-icon svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .portal-entry:hover .portal-icon {
      transform: translate3d(4px, 0, 0);
      opacity: 1;
    }

    /* 底部纤细呼吸流光线 */
    .portal-hairline {
      width: 36px;
      height: 1.5px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0.88),
        rgba(255, 255, 255, 0)
      );
      opacity: 0.75;
      transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
    }

    .portal-container:hover .portal-hairline {
      width: 72px;
      opacity: 1;
    }

    /* 转场进入工坊时的丝滑羽化离场动效 */
    body.leaving-stage #ui-container,
    body.leaving-stage #frost-overlay,
    body.leaving-stage #video-wrapper {
      opacity: 0;
      transition: opacity 0.32s ease;
    }

    body.leaving-stage {
      background: #f9fbfe;
    }

    /* 移动端视口精细适配与轻量化渲染 */
    @media (max-width: 640px) {
      #video-wrapper,
      #frost-overlay {
        background-position: 49.2% center;
      }

      #bg-video {
        object-position: 49.2% center;
      }

      .ui-logo {
        width: clamp(260px, 70vw, 350px);
        height: clamp(260px, 70vw, 350px);
        filter: none;
      }

      .logo-halo {
        width: clamp(290px, 78vw, 390px);
        height: clamp(290px, 78vw, 390px);
      }

      .portal-container {
        bottom: 8vh;
      }

      .portal-entry {
        padding: 11px 30px 11px 36px;
        gap: 11px;
      }

      .portal-label {
        font-size: 0.9rem;
        letter-spacing: 0.36em;
      }

      #touch-veil {
        padding-bottom: 9.5vh;
      }

      .touch-caption {
        font-size: 0.78rem;
        letter-spacing: 0.36em;
      }
    }
  </style>
</head>
<body>

  <!-- 视频背景：内联 poster 首帧图，杜绝任何移动端黑屏与解码阻塞 -->
  <div id="video-wrapper">
    <video
      id="bg-video"
      poster="imgs/intro_poster.jpg"
      playsinline
      webkit-playsinline
      x5-playsinline
      muted
      preload="auto"
      disablePictureInPicture
    >
      <source src="video/intro.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- 黄金适耳定制音频：已精确对齐两次 UI 浮现和弦，并删去后续多余音乐 -->
  <audio id="ambient-audio" preload="auto">
    <source src="audio/言叶之庭.aac" type="audio/aac" />
  </audio>

  <!-- 预渲染高清雾化毛玻璃层（零 GPU 实时模糊开销） -->
  <div id="frost-overlay"></div>

  <!-- 移动端/受限环境下的诗意轻触唤醒层 -->
  <div id="touch-veil" role="button" tabindex="0" aria-label="轻触开启音画体验">
    <div class="touch-cue">
      <div class="touch-ripple-ring">
        <span class="touch-core-dot"></span>
      </div>
      <span class="touch-caption">轻触画面 · 聆听花开</span>
    </div>
  </div>

  <!-- 纯净毛玻璃 UI 层：与第二声清脆钢琴和弦同步浮现 -->
  <main id="ui-container" aria-hidden="true">
    <div class="ui-content">
      <div class="logo-halo"></div>
      <div class="logo-wrapper">
        <img
          id="ui-logo"
          class="ui-logo"
          src="imgs/TuKuaiStudio.png"
          alt="图快工坊 TuKuai Studio"
          draggable="false"
        />
      </div>
    </div>

    <!-- 全新极简高定「流光晶透羽化入口」 -->
    <div class="portal-container">
      <a href="index.html" class="portal-entry" id="enter-btn">
        <span class="portal-spark"></span>
        <span class="portal-label">进入工坊</span>
        <span class="portal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h13" />
            <path d="M13 6l6 6-6 6" />
          </svg>
        </span>
      </a>
      <div class="portal-hairline" aria-hidden="true"></div>
    </div>
  </main>

  <script>
  (function () {
    const video = document.getElementById('bg-video');
    const ambientAudio = document.getElementById('ambient-audio');
    const logoImg = document.getElementById('ui-logo');
    const enterBtn = document.getElementById('enter-btn');

    let isRevealed = false;
    let hasStarted = false;
    let isNavigating = false;
    let fallbackTimer = null;

    // 黄金适耳音量：配合已母带柔化处理的言叶之庭音频，温润清透不刺耳
    const GOLDEN_AUDIO_VOL = 0.68;
    // 第二声和弦（网页毛玻璃 UI 浮现）精确时间点
    const UI_REVEAL_TIME = 4.16;

    ambientAudio.loop = false;
    ambientAudio.volume = GOLDEN_AUDIO_VOL;

    function removeGestureListeners() {
      window.removeEventListener('touchend', onUserGesture);
      window.removeEventListener('click', onUserGesture);
      window.removeEventListener('keydown', onUserGesture);
    }

    function scheduleFallbackReveal() {
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
      }
      // 兜底保护：即便手机省电模式拦截视频解码，也绝不卡死，准时在 4.5s 浮现工坊 UI
      fallbackTimer = setTimeout(revealFrostedUI, 4500);
    }

    // 用户触屏/点击唤醒：在同一个同步调用栈内直接同时启动 video 与 audio，绝不二次重置 currentTime
    function onUserGesture() {
      if (hasStarted || isRevealed) return;
      hasStarted = true;

      removeGestureListeners();
      document.body.classList.remove('awaiting-gesture');
      scheduleFallbackReveal();

      ambientAudio.volume = GOLDEN_AUDIO_VOL;
      const vPromise = video.play();
      if (vPromise !== undefined) {
        vPromise.catch(function () {});
      }
      const aPromise = ambientAudio.play();
      if (aPromise !== undefined) {
        aPromise.catch(function () {});
      }
    }

    // 桌面端/允许自动有声播放的环境：尝试静默同步自启一次
    function tryAutoStartOnce() {
      if (hasStarted || isRevealed) return;

      // 触屏移动设备浏览器均需手势解锁有声播放，直接展示轻触引导，避免无效 play() 阻塞解码器
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (isTouchDevice) {
        document.body.classList.add('awaiting-gesture');
        return;
      }

      const aPromise = ambientAudio.play();
      if (aPromise !== undefined) {
        aPromise.then(function () {
          if (hasStarted || isRevealed) return;
          hasStarted = true;
          removeGestureListeners();
          document.body.classList.remove('awaiting-gesture');
          scheduleFallbackReveal();
          const vPromise = video.play();
          if (vPromise !== undefined) {
            vPromise.catch(function () {});
          }
        }).catch(function () {
          if (!hasStarted && !isRevealed) {
            document.body.classList.add('awaiting-gesture');
          }
        });
      }
    }

    // 仅绑定 touchend / click / keydown，且通过 hasStarted 同步锁杜绝同一点击触发多次
    window.addEventListener('touchend', onUserGesture, { passive: true });
    window.addEventListener('click', onUserGesture, { passive: true });
    window.addEventListener('keydown', onUserGesture, { passive: true });

    tryAutoStartOnce();

    // 视频到达尾帧并转化为毛玻璃雾化 UI（与第二声钢琴和弦 4.18s 自然同步，不强行 seek 音频）
    function revealFrostedUI() {
      if (isRevealed) return;
      isRevealed = true;

      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }

      removeGestureListeners();
      document.body.classList.remove('awaiting-gesture');

      try {
        if (!video.paused) {
          video.pause();
        }
      } catch (err) {}

      // 激活毛玻璃全屏雾化与高光 UI
      document.body.classList.add('frosted-active');
      const uiContainer = document.getElementById('ui-container');
      if (uiContainer) {
        uiContainer.removeAttribute('aria-hidden');
      }
    }

    // 1. 视频自然播放到结尾转场
    video.addEventListener('ended', revealFrostedUI, { once: true });

    // 2. 紧贴第二声和弦时间点（4.16s）触发平滑转场
    video.addEventListener('timeupdate', function () {
      if (video.currentTime >= UI_REVEAL_TIME) {
        revealFrostedUI();
      }
    });

    // 3. 容错兜底：若视频资源异常，直接展示毛玻璃 UI
    video.addEventListener('error', revealFrostedUI, { once: true });

    // 4. 优雅丝滑转场进入主站 index.html
    function navigateToStudio(e) {
      if (e) {
        e.preventDefault();
      }
      if (isNavigating) return;
      isNavigating = true;

      document.body.classList.add('leaving-stage');
      try {
        ambientAudio.pause();
      } catch (err) {}

      setTimeout(function () {
        window.location.href = 'index.html';
      }, 300);
    }

    if (enterBtn) {
      enterBtn.addEventListener('click', navigateToStudio);
    }
    if (logoImg) {
      logoImg.addEventListener('click', navigateToStudio);
    }

    // 5. 页面可见性管理：切后台时暂停，切回时恢复
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (!isRevealed && !video.paused) {
          video.pause();
        }
        if (!ambientAudio.paused) {
          ambientAudio.pause();
        }
      } else if (hasStarted && !isRevealed) {
        video.play().catch(function () {});
        ambientAudio.play().catch(function () {});
      }
    });
  })();
  </script>
</body>
</html>
