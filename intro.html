<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b8d7e2" />
  <title>別來無恙</title>
  <link rel="icon" href="imgs/TuKuaiStudio.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="imgs/TuKuaiStudio.ico" type="image/x-icon" />
  <!-- 預載入首幀海報、預渲染毛玻璃尾幀與高清 Logo，0 毫秒立現且零 GPU 卡頓 -->
  <link rel="preload" as="image" href="imgs/intro_poster.jpg" fetchpriority="high" />
  <link rel="preload" as="image" href="imgs/intro_frosted.jpg" />
  <link rel="preload" as="image" href="imgs/TuKuaiStudio.png" />
  <style>
    /* 全域重設 */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #b8d7e2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Serif TC", "PMingLiU", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", STSong, SimSun, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }

    /* 影片背景全螢幕層：使用靜態首幀圖兜底，不對 <video> 施加任何即時濾鏡以徹底杜絕手機端 GPU 卡死 */
    #video-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 1;
      overflow: hidden;
      background: #b8d7e2 url("imgs/intro_poster.jpg") center center / cover no-repeat;
    }

    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: transparent;
      transform: translateZ(0);
    }

    /* 霧化毛玻璃層：採用預渲染高清高斯霧化圖，僅做純硬體加速 opacity 過渡，手機端滿幀零開銷 */
    #frost-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      background: #d8eaf6 url("imgs/intro_frosted.jpg") center center / cover no-repeat;
      box-shadow: inset 0 0 120px rgba(255, 255, 255, 0.45);
      transition: opacity 1.15s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }

    body.frosted-active #frost-overlay {
      opacity: 1;
    }

    /* 行動端/受限環境下的詩意輕觸喚醒層（全螢幕任意處輕觸即刻同步起播） */
    #touch-veil {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 11vh;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      background: radial-gradient(
        circle at 50% 82%,
        rgba(12, 32, 52, 0.18) 0%,
        rgba(12, 32, 52, 0) 60%
      );
      transition: opacity 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }

    body.awaiting-gesture #touch-veil {
      opacity: 1;
      pointer-events: auto;
    }

    .touch-cue {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* 呼吸水波光環 */
    .touch-ripple-ring {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 24px rgba(15, 40, 68, 0.16),
                  inset 0 1px 1.5px rgba(255, 255, 255, 0.92);
    }

    .touch-ripple-ring::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.65);
      animation: ripplePulse 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      pointer-events: none;
    }

    .touch-core-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
    }

    @keyframes ripplePulse {
      0% {
        transform: scale(1);
        opacity: 0.78;
      }
      100% {
        transform: scale(2.05);
        opacity: 0;
      }
    }

    .touch-caption {
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 2px 10px rgba(10, 30, 52, 0.45);
    }

    /* 純淨UI高光容器 (與第二聲鋼琴和弦同步浮現) */
    #ui-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }

    body.frosted-active #ui-container {
      opacity: 1;
      pointer-events: auto;
    }

    /* Logo 視覺包裝盒：精準對齊影片尾幀幾何中心 (Y: 41.7%) */
    .ui-content {
      position: absolute;
      top: 41.7%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0) scale(0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 1.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.frosted-active .ui-content {
      transform: translate3d(-50%, -50%, 0) scale(1);
    }

    /* 柔透微光暈：純徑向漸層實現柔和光暈，避免動態 blur 濾鏡消耗手機顯示記憶體 */
    .logo-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: clamp(380px, 68vh, 580px);
      height: clamp(380px, 68vh, 580px);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.96) 0%,
        rgba(255, 255, 255, 0.68) 26%,
        rgba(165, 225, 255, 0.38) 48%,
        rgba(210, 240, 255, 0.12) 64%,
        rgba(255, 255, 255, 0) 76%
      );
      pointer-events: none;
      animation: breatheHalo 4.5s ease-in-out infinite;
    }

    @keyframes breatheHalo {
      0%, 100% {
        opacity: 0.86;
        transform: translate3d(-50%, -50%, 0) scale(0.96);
      }
      50% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) scale(1.05);
      }
    }

    /* 純淨 Logo 特效包裝 */
    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatLogo 5s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translate3d(0, 0, 0);
      }
      50% {
        transform: translate3d(0, -7px, 0);
      }
    }

    /* 高清 Logo 影像：輕量硬體合成，杜絕多重高半徑 drop-shadow 導致行動端掉幀 */
    .ui-logo {
      display: block;
      width: clamp(340px, 78vh, 560px);
      height: clamp(340px, 78vh, 560px);
      object-fit: contain;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transform: translate3d(0, 0, 0);
      filter: drop-shadow(0 12px 26px rgba(15, 38, 65, 0.16));
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .ui-logo:hover {
      transform: scale(1.03) translate3d(0, 0, 0);
    }

    /* ==========================================================
       全新極簡高定「流光晶透羽化入口」設計 (Portal Entry)
       ========================================================== */
    .portal-container {
      position: fixed;
      bottom: 9.2vh;
      left: 50%;
      transform: translate3d(-50%, 18px, 0);
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                  transform 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }

    body.frosted-active .portal-container {
      opacity: 1;
      transform: translate3d(-50%, 0, 0);
      pointer-events: auto;
    }

    .portal-entry {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 12px 36px 12px 42px;
      border-radius: 9999px;
      text-decoration: none;
      color: #16293a;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.76) 0%,
        rgba(244, 250, 255, 0.56) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 32px rgba(16, 42, 68, 0.10),
                  inset 0 1px 1.5px rgba(255, 255, 255, 0.98),
                  0 0 24px rgba(255, 255, 255, 0.45);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.4s ease,
                  box-shadow 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* 五色微光極光底襯（呼應圖快五瓣色彩） */
    .portal-entry::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        rgba(250, 124, 133, 0.12),
        rgba(104, 189, 245, 0.14),
        rgba(72, 203, 161, 0.12),
        rgba(245, 202, 85, 0.12),
        rgba(174, 125, 232, 0.12)
      );
      opacity: 0.6;
      pointer-events: none;
    }

    .portal-entry:hover {
      transform: translate3d(0, -2px, 0) scale(1.025);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.72) 100%
      );
      border-color: #ffffff;
      color: #0c1d2c;
      box-shadow: 0 16px 40px rgba(32, 95, 150, 0.16),
                  inset 0 1.5px 2px #ffffff,
                  0 0 32px rgba(255, 255, 255, 0.8);
    }

    .portal-entry:active {
      transform: translate3d(0, 0.5px, 0) scale(0.98);
    }

    /* 左側呼吸星芒微點 */
    .portal-spark {
      position: relative;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3989ec, #27ad80);
      box-shadow: 0 0 8px rgba(57, 137, 236, 0.6);
      flex-shrink: 0;
    }

    .portal-label {
      position: relative;
      z-index: 1;
      font-size: 0.96rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      white-space: nowrap;
    }

    .portal-icon {
      position: relative;
      z-index: 1;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #243b4f;
      opacity: 0.82;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }

    .portal-icon svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .portal-entry:hover .portal-icon {
      transform: translate3d(4px, 0, 0);
      opacity: 1;
    }

    /* 底部纖細呼吸流光線 */
    .portal-hairline {
      width: 36px;
      height: 1.5px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0.88),
        rgba(255, 255, 255, 0)
      );
      opacity: 0.75;
      transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
    }

    .portal-container:hover .portal-hairline {
      width: 72px;
      opacity: 1;
    }

    /* 轉場進入工坊時的絲滑羽化離場動效 */
    body.leaving-stage #ui-container,
    body.leaving-stage #frost-overlay,
    body.leaving-stage #video-wrapper {
      opacity: 0;
      transition: opacity 0.32s ease;
    }

    body.leaving-stage {
      background: #f9fbfe;
    }

    /* 行動端視口精細適配與輕量化渲染 */
    @media (max-width: 640px) {
      #video-wrapper,
      #frost-overlay {
        background-position: 49.2% center;
      }

      #bg-video {
        object-position: 49.2% center;
      }

      .ui-logo {
        width: clamp(260px, 70vw, 350px);
        height: clamp(260px, 70vw, 350px);
        filter: none;
      }

      .logo-halo {
        width: clamp(290px, 78vw, 390px);
        height: clamp(290px, 78vw, 390px);
      }

      .portal-container {
        bottom: 8vh;
      }

      .portal-entry {
        padding: 11px 30px 11px 36px;
        gap: 11px;
      }

      .portal-label {
        font-size: 0.9rem;
        letter-spacing: 0.36em;
      }

      #touch-veil {
        padding-bottom: 9.5vh;
      }

      .touch-caption {
        font-size: 0.78rem;
        letter-spacing: 0.36em;
      }
    }
  </style>
</head>
<body>

  <!-- 影片背景：內嵌 poster 首幀圖，杜絕任何行動端黑屏與解碼阻塞 -->
  <div id="video-wrapper">
    <video
      id="bg-video"
      poster="imgs/intro_poster.jpg"
      playsinline
      webkit-playsinline
      x5-playsinline
      muted
      preload="auto"
      disablePictureInPicture
    >
      <source src="video/intro.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- 黃金適耳訂製音訊：已精確對齊兩次 UI 浮現和弦，並刪去後續多餘音樂 -->
  <audio id="ambient-audio" preload="auto">
    <source src="audio/言叶之庭.aac" type="audio/aac" />
  </audio>

  <!-- 預渲染高清霧化毛玻璃層（零 GPU 即時模糊開銷） -->
  <div id="frost-overlay"></div>

  <!-- 行動端/受限環境下的詩意輕觸喚醒層 -->
  <div id="touch-veil" role="button" tabindex="0" aria-label="輕觸開啟音畫體驗">
    <div class="touch-cue">
      <div class="touch-ripple-ring">
        <span class="touch-core-dot"></span>
      </div>
      <span class="touch-caption">輕觸畫面 · 聆聽花開</span>
    </div>
  </div>

  <!-- 純淨毛玻璃 UI 層：與第二聲清脆鋼琴和弦同步浮現 -->
  <main id="ui-container" aria-hidden="true">
    <div class="ui-content">
      <div class="logo-halo"></div>
      <div class="logo-wrapper">
        <img
          id="ui-logo"
          class="ui-logo"
          src="imgs/TuKuaiStudio.png"
          alt="圖塊工坊 TuKuai Studio"
          draggable="false"
        />
      </div>
    </div>

    <!-- 全新極簡高定「流光晶透羽化入口」 -->
    <div class="portal-container">
      <a href="index.html" class="portal-entry" id="enter-btn">
        <span class="portal-spark"></span>
        <span class="portal-label">進入工坊</span>
        <span class="portal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h13" />
            <path d="M13 6l6 6-6 6" />
          </svg>
        </span>
      </a>
      <div class="portal-hairline" aria-hidden="true"></div>
    </div>
  </main>

  <script>
  (function () {
    const video = document.getElementById('bg-video');
    const ambientAudio = document.getElementById('ambient-audio');
    const logoImg = document.getElementById('ui-logo');
    const enterBtn = document.getElementById('enter-btn');

    let isRevealed = false;
    let hasStarted = false;
    let isNavigating = false;
    let fallbackTimer = null;

    // 黃金適耳音量：配合已母帶柔化處理的《言葉之庭》音訊，溫潤清透不刺耳
    const GOLDEN_AUDIO_VOL = 0.68;
    // 第二聲和弦（網頁毛玻璃 UI 浮現）精確時間點
    const UI_REVEAL_TIME = 4.16;

    ambientAudio.loop = false;
    ambientAudio.volume = GOLDEN_AUDIO_VOL;

    function removeGestureListeners() {
      window.removeEventListener('touchend', onUserGesture);
      window.removeEventListener('click', onUserGesture);
      window.removeEventListener('keydown', onUserGesture);
    }

    function scheduleFallbackReveal() {
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
      }
      // 兜底保護：即便手機省電模式攔截影片解碼，也絕不卡死，準時在 4.5s 浮現工坊 UI
      fallbackTimer = setTimeout(revealFrostedUI, 4500);
    }

    // 使用者觸控/點擊喚醒：在同一個同步呼叫堆疊內直接同時啟動 video 與 audio，絕不二次重設 currentTime
    function onUserGesture() {
      if (hasStarted || isRevealed) return;
      hasStarted = true;

      removeGestureListeners();
      document.body.classList.remove('awaiting-gesture');
      scheduleFallbackReveal();

      ambientAudio.volume = GOLDEN_AUDIO_VOL;
      const vPromise = video.play();
      if (vPromise !== undefined) {
        vPromise.catch(function () {});
      }
      const aPromise = ambientAudio.play();
      if (aPromise !== undefined) {
        aPromise.catch(function () {});
      }
    }

    // 桌面端/允許自動有聲播放的環境：嘗試靜默同步自啟一次
    function tryAutoStartOnce() {
      if (hasStarted || isRevealed) return;

      // 觸控行動裝置瀏覽器均需手勢解鎖有聲播放，直接展示輕觸引導，避免無效 play() 阻塞解碼器
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (isTouchDevice) {
        document.body.classList.add('awaiting-gesture');
        return;
      }

      const aPromise = ambientAudio.play();
      if (aPromise !== undefined) {
        aPromise.then(function () {
          if (hasStarted || isRevealed) return;
          hasStarted = true;
          removeGestureListeners();
          document.body.classList.remove('awaiting-gesture');
          scheduleFallbackReveal();
          const vPromise = video.play();
          if (vPromise !== undefined) {
            vPromise.catch(function () {});
          }
        }).catch(function () {
          if (!hasStarted && !isRevealed) {
            document.body.classList.add('awaiting-gesture');
          }
        });
      }
    }

    // 僅綁定 touchend / click / keydown，且透過 hasStarted 同步鎖杜絕同一點擊觸發多次
    window.addEventListener('touchend', onUserGesture, { passive: true });
    window.addEventListener('click', onUserGesture, { passive: true });
    window.addEventListener('keydown', onUserGesture, { passive: true });

    tryAutoStartOnce();

    // 影片到達尾幀並轉化為毛玻璃霧化 UI（與第二聲鋼琴和弦 4.18s 自然同步，不強行 seek 音訊）
    function revealFrostedUI() {
      if (isRevealed) return;
      isRevealed = true;

      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }

      removeGestureListeners();
      document.body.classList.remove('awaiting-gesture');

      try {
        if (!video.paused) {
          video.pause();
        }
      } catch (err) {}

      // 啟用毛玻璃全螢幕霧化與高光 UI
      document.body.classList.add('frosted-active');
      const uiContainer = document.getElementById('ui-container');
      if (uiContainer) {
        uiContainer.removeAttribute('aria-hidden');
      }
    }

    // 1. 影片自然播放到結尾轉場
    video.addEventListener('ended', revealFrostedUI, { once: true });

    // 2. 緊貼第二聲和弦時間點（4.16s）觸發平滑轉場
    video.addEventListener('timeupdate', function () {
      if (video.currentTime >= UI_REVEAL_TIME) {
        revealFrostedUI();
      }
    });

    // 3. 容錯兜底：若影片資源異常，直接展示毛玻璃 UI
    video.addEventListener('error', revealFrostedUI, { once: true });

    // 4. 優雅絲滑轉場進入主站 index.html
    function navigateToStudio(e) {
      if (e) {
        e.preventDefault();
      }
      if (isNavigating) return;
      isNavigating = true;

      document.body.classList.add('leaving-stage');
      try {
        ambientAudio.pause();
      } catch (err) {}

      setTimeout(function () {
        window.location.href = 'index.html';
      }, 300);
    }

    if (enterBtn) {
      enterBtn.addEventListener('click', navigateToStudio);
    }
    if (logoImg) {
      logoImg.addEventListener('click', navigateToStudio);
    }

    // 5. 頁面可見性管理：切背景時暫停，切回時恢復
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (!isRevealed && !video.paused) {
          video.pause();
        }
        if (!ambientAudio.paused) {
          ambientAudio.pause();
        }
      } else if (hasStarted && !isRevealed) {
        video.play().catch(function () {});
        ambientAudio.play().catch(function () {});
      }
    });
  })();
  </script>
</body>
</html>
